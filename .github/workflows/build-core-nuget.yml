name: LibDmd.Core NuGet

# Builds and publishes LibDmd.Core, its Unity integrations, and the per-platform native packages.

on:
  push:
    tags: [ "core-v*" ]
  pull_request:
    paths:
      - "LibDmd.Core/**"
      - "LibDmd.Core.Windows/**"
      - "LibDmd.Core.Sdl/**"
      - "LibDmd.Core.SerialShim/**"
      - "LibDmd.Core.Tests/**"
      - "LibDmd/**"
      - "native/nuget/**"
      - "native/vendor/**"
      - "build-nuget/**"
      - ".github/workflows/build-core-nuget.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0). Leave blank for a CI dev version."
        required: false
      release_tag:
        description: "Publish an existing core-v* tag. Leave blank to build only."
        type: string
        required: false

env:
  SERUM_VERSION: "2.8.2"
  ZEDMD_VERSION: "0.11.0"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test frame processing and allocations
        run: dotnet test LibDmd.Core.Tests/LibDmd.Core.Tests.csproj -c Release

  pack:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || '' }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        id: ver
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          ref="${RELEASE_TAG:+refs/tags/$RELEASE_TAG}"
          ref="${ref:-$GITHUB_REF}"
          if [[ "$ref" == refs/tags/core-v?* ]]; then
            version="${ref#refs/tags/core-v}"
          elif [[ -n "$RELEASE_TAG" ]]; then
            echo "::error::The release tag must start with core-v followed by the package version."
            exit 1
          else
            version="${BUILD_VERSION:-0.0.0-ci.$GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch native binaries
        shell: bash
        run: ./build-nuget/fetch-natives.sh

      - name: Pack
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.version }}
        run: ./build-nuget/pack.ps1 -Version "$env:PACKAGE_VERSION" -SerumVersion "$env:SERUM_VERSION" -ZedmdVersion "$env:ZEDMD_VERSION" -SkipFetch

      - uses: actions/upload-artifact@v4
        with:
          name: libdmd-core-nuget-${{ steps.ver.outputs.version }}
          path: artifacts/*.nupkg

  # The native packages hold only vendored binaries, so managed sources cannot change what the checker loads.
  changes:
    runs-on: ubuntu-latest
    outputs:
      natives: ${{ steps.filter.outputs.natives }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Look for changes to the native packages
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            echo "A tag or a manual run checks the native packages."
            echo "natives=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the nuspec files name every source outside native/nuget that the packages carry
          readarray -t packed < <(
            grep -ho 'src="[^"]*"' native/nuget/*.nuspec |
              sed -e 's|^src="||' -e 's|"$||' -e 's|\\|/|g' |
              { grep '^\.\./\.\./' || true; } |
              sed -e 's|^\.\./\.\./||' |
              sort -u
          )
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            native/nuget native/vendor build-nuget .github/workflows/build-core-nuget.yml \
            "${packed[@]}")
          if [[ -n "$changed" ]]; then
            echo "The native packages change here:"
            echo "$changed"
            echo "natives=true" >> "$GITHUB_OUTPUT"
          else
            echo "This pull request leaves the native packages alone."
            echo "natives=false" >> "$GITHUB_OUTPUT"
          fi

  # Every native library of each package loads on its platform: Windows imports resolve, macOS signatures verify.
  natives:
    needs: [ pack, changes ]
    if: needs.changes.outputs.natives == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      # the checker of the workflow's revision: the package comes from pack, and older tags don't have the checker
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: libdmd-core-nuget-${{ needs.pack.outputs.version }}
          path: artifacts

      - name: Load the native libraries
        shell: bash
        run: python build-nuget/check-natives.py "artifacts/LibDmd.Core.Native.${{ matrix.rid }}.${{ needs.pack.outputs.version }}.nupkg"

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/core-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' &&
      github.ref_name == github.event.repository.default_branch)
    needs: [ pack, natives ]
    runs-on: windows-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libdmd-core-nuget-${{ needs.pack.outputs.version }}
          path: artifacts

      - name: Sign in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $ids = @(
            'LibDmd.Core.Native.win-x64'
            'LibDmd.Core.Native.osx-x64'
            'LibDmd.Core.Native.osx-arm64'
            'LibDmd.Core.Native.linux-x64'
            'LibDmd.Core.Native'
            'LibDmd.Core'
          )
          $packages = foreach ($id in $ids) {
            Get-Item -LiteralPath "artifacts/$id.$env:PACKAGE_VERSION.nupkg"
          }
          # Older release tags predate the Unity package.
          $unityPackage = "artifacts/LibDmd.Core.Unity.$env:PACKAGE_VERSION.nupkg"
          if (Test-Path -LiteralPath $unityPackage) {
            $packages += Get-Item -LiteralPath $unityPackage
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet push failed for $($package.Name)." }
          }
